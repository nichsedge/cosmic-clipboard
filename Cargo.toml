[package]
name = "cosmic-clipboard"
version = "0.2.0"
edition = "2021"
authors = ["nichsedge <nichsedge@users.noreply.github.com>"]
description = "Native high-performance GTK4/Libadwaita/COSMIC clipboard history manager"
license = "MIT"
repository = "https://github.com/nichsedge/cosmic-clipboard"
readme = "README.md"
keywords = ["clipboard", "wayland", "cosmic", "gtk4", "libadwaita"]
categories = ["gui", "command-line-utilities"]

[dependencies]
gtk4 = { version = "0.11", features = ["v4_16"] }
libadwaita = { version = "0.9", features = ["v1_6"] }
gtk4-layer-shell = "0.8"
glib = "0.22"
gio = "0.22"
gdk4 = "0.11"
gdk-pixbuf = "0.22"
pango = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
rayon = "1.10"
cosmic-protocols = { version = "0.2.0", features = ["client"] }
wayland-client = "0.31.15"
ksni = { version = "0.3.6", features = ["blocking"] }
toml = "1.1.8"
